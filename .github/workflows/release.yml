# Release the npm package manually and create the matching GitHub release.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

run-name: "${{ format('Manual release ({0}) by @{1}', inputs.version || inputs.release_type, github.actor) }}"

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format (overrides release_type)"
                required: false
                type: "string"
            ref:
                description: "Branch to release from, or the matching tag when recovering"
                required: false
                default: "main"
                type: "string"
            recover_existing_tag:
                description: "Recover a partial release from an existing tag (requires version and matching tag ref)"
                required: true
                default: false
                type: "boolean"

concurrency:
    group: "${{ github.workflow }}-${{ github.repository }}"
    cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"

defaults:
    run:
        shell: "bash"

jobs:
    publish:
        name: "Publish npm package and GitHub release"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "write"
            id-token: "write"
        outputs:
            github_release_url: "${{ steps.version.outputs.github_release_url }}"
            npm_release_url: "${{ steps.version.outputs.npm_release_url }}"
            package_name: "${{ steps.version.outputs.package_name }}"
            tag: "${{ steps.version.outputs.tag }}"
            version: "${{ steps.version.outputs.version }}"
        env:
            CI: "true"
            DEFAULT_RELEASE_BRANCH: "main"
            NPM_REGISTRY_URL: "https://registry.npmjs.org"
            RELEASE_NOTES_PATH: "temp/release-notes.md"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Resolve target ref"
              id: "target_ref"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RECOVER_EXISTING_TAG: "${{ inputs.recover_existing_tag }}"
                  WORKFLOW_DISPATCH_REF: "${{ inputs.ref }}"
              run: |
                  set -euo pipefail
                  requested_ref="${WORKFLOW_DISPATCH_REF:-}"
                  recover_existing_tag="${RECOVER_EXISTING_TAG:-false}"

                  if [ "$recover_existing_tag" = "true" ]; then
                    explicit_version="${EXPLICIT_VERSION:-}"
                    if [[ ! "$explicit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Existing-tag recovery requires an explicit x.y.z version." >&2
                      exit 1
                    fi

                    expected_tag="v${explicit_version}"
                    requested_tag="${requested_ref#refs/tags/}"
                    if [ "$requested_tag" != "$expected_tag" ]; then
                      echo "Recovery ref must be ${expected_tag}, not ${requested_ref:-<empty>}." >&2
                      exit 1
                    fi

                    {
                      echo "ref=refs/tags/${expected_tag}"
                      echo "branch="
                      echo "recovery=true"
                      echo "source=${expected_tag}"
                    } >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  branch="$requested_ref"
                  if [ -z "$branch" ]; then
                    branch="${DEFAULT_RELEASE_BRANCH}"
                  fi
                  branch="${branch#refs/heads/}"
                  if [[ "$branch" == refs/tags/* || "$branch" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "workflow_dispatch ref must be a branch, not a tag: $branch" >&2
                    exit 1
                  fi

                  {
                    echo "ref=$branch"
                    echo "branch=$branch"
                    echo "recovery=false"
                    echo "source=$branch"
                  } >> "$GITHUB_OUTPUT"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  ref: "${{ steps.target_ref.outputs.ref }}"
                  token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  registry-url: "${{ env.NPM_REGISTRY_URL }}"
                  package-manager-cache: false

            - name: "Install repository npm version"
              run: |
                  npm install --global --ignore-scripts "$(node --print "require('./package.json').packageManager")"

            - name: "Setup Go for native security scanners"
              uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
              with:
                  cache-dependency-path: "tools/go.sum"
                  go-version-file: "tools/go.mod"

            - name: "Install dependencies"
              run: "npm ci --ignore-scripts"

            - name: "Rebuild approved native dependencies"
              run: "npm rebuild @swc/core esbuild unrs-resolver"

            - name: "Install native lint tools"
              working-directory: "tools"
              env:
                  GOFLAGS: "-mod=readonly"
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes yamllint
                  go mod download
                  go mod verify
                  go install github.com/rhysd/actionlint/cmd/actionlint
                  go install github.com/zricethezav/gitleaks/v8
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: "Build package"
              run: "npm run build"

            - name: "Configure Git for release automation"
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch --tags --force

            - name: "Validate release input"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RECOVER_EXISTING_TAG: "${{ inputs.recover_existing_tag }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail
                  explicit_version="${EXPLICIT_VERSION:-}"
                  recover_existing_tag="${RECOVER_EXISTING_TAG:-false}"
                  if [ "$recover_existing_tag" = "true" ] && [ -z "$explicit_version" ]; then
                    echo "Existing-tag recovery requires an explicit version." >&2
                    exit 1
                  fi

                  if [ -n "$explicit_version" ]; then
                    if [[ ! "$explicit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid version input '$explicit_version'. Use x.y.z format." >&2
                      exit 1
                    fi
                    exit 0
                  fi

                  release_type="${RELEASE_TYPE:-patch}"
                  case "$release_type" in
                    patch|minor|major)
                      exit 0
                      ;;
                    *)
                      echo "Invalid release_type '$release_type'. Allowed: patch, minor, major." >&2
                      exit 1
                      ;;
                  esac

            - name: "Verify package"
              run: "npm run release:check"

            - name: "Ensure verification did not modify tracked files"
              run: |
                  set -euo pipefail
                  if ! git diff --quiet || ! git diff --cached --quiet; then
                    echo "release:check modified tracked files. Fix the repository state before releasing." >&2
                    git status --short
                    exit 1
                  fi

            - name: "Determine release version"
              id: "version"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RECOVER_EXISTING_TAG: "${{ inputs.recover_existing_tag }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail

                  explicit_version="${EXPLICIT_VERSION:-}"
                  recover_existing_tag="${RECOVER_EXISTING_TAG:-false}"
                  if [ "$recover_existing_tag" = "true" ]; then
                    version=$(node -p "require('./package.json').version")
                    if [ "$version" != "$explicit_version" ]; then
                      echo "Recovery tag contains package version ${version}, expected ${explicit_version}." >&2
                      exit 1
                    fi
                  elif [ -n "$explicit_version" ]; then
                    npm version "$explicit_version" --no-git-tag-version
                    version="$explicit_version"
                  else
                    release_type="${RELEASE_TYPE:-patch}"
                    npm version "$release_type" --no-git-tag-version
                    version=$(node -p "require('./package.json').version")
                  fi

                  package_name=$(node -p "require('./package.json').name")
                  tag="v${version}"
                  npm_release_url="https://www.npmjs.com/package/${package_name}/v/${version}"
                  github_release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"

                  {
                    echo "version=$version"
                    echo "tag=$tag"
                    echo "package_name=$package_name"
                    echo "npm_release_url=$npm_release_url"
                    echo "github_release_url=$github_release_url"
                  } >> "$GITHUB_OUTPUT"

            - name: "Check whether version is already published"
              id: "npm_check"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
                    echo "already_published=true" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is already published to npm."
                  else
                    echo "already_published=false" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is available for publishing."
                  fi

            - name: "Prevent duplicate release version"
              if: "steps.npm_check.outputs.already_published == 'true' && inputs.recover_existing_tag != true"
              env:
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  echo "Version ${VERSION} is already published. Choose a new release type/version." >&2
                  exit 1

            - name: "Verify existing published release identity"
              if: "steps.npm_check.outputs.already_published == 'true' && inputs.recover_existing_tag == true"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  registry_git_head=$(npm view "${PACKAGE_NAME}@${VERSION}" dist.gitHead)
                  head_commit=$(git rev-parse HEAD)
                  if [ -z "$registry_git_head" ] || [ "$registry_git_head" != "$head_commit" ]; then
                    echo "Published ${PACKAGE_NAME}@${VERSION} has gitHead ${registry_git_head:-<missing>}, expected ${head_commit}." >&2
                    exit 1
                  fi

            - name: "Commit and push release version + tag"
              env:
                  BRANCH: "${{ steps.target_ref.outputs.branch }}"
                  RECOVER_EXISTING_TAG: "${{ inputs.recover_existing_tag }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if [ "${RECOVER_EXISTING_TAG:-false}" = "true" ]; then
                    tag_ref="refs/tags/${TAG}"
                    if ! git show-ref --verify --quiet "$tag_ref"; then
                      echo "Recovery tag ${TAG} does not exist locally." >&2
                      exit 1
                    fi

                    tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                    head_commit=$(git rev-parse HEAD)
                    if [ "$tag_commit" != "$head_commit" ]; then
                      echo "Recovery tag ${TAG} points to ${tag_commit}, but HEAD is ${head_commit}." >&2
                      exit 1
                    fi

                    if ! git diff --quiet || ! git diff --cached --quiet; then
                      echo "Recovery checkout contains tracked changes." >&2
                      git status --short
                      exit 1
                    fi

                    echo "Using existing release tag ${TAG} at ${head_commit}."
                    exit 0
                  fi

                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists locally." >&2
                    exit 1
                  fi

                  git add package.json package-lock.json
                  if git diff --cached --quiet; then
                    echo "No staged changes found for release commit." >&2
                    exit 1
                  fi

                  git commit -m "chore: release ${TAG}"
                  git tag -a "$TAG" -m "$TAG"
                  git push origin "HEAD:${BRANCH}"
                  git push origin "$TAG"

            - name: "Publish to npm"
              if: "steps.npm_check.outputs.already_published != 'true'"
              run: "npm publish --access public --provenance"
              env:
                  NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"

            - name: "Generate release notes"
              env:
                  EXPECTED_TAG: "${{ steps.version.outputs.tag }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  tag_ref="refs/tags/${EXPECTED_TAG}"
                  if ! git show-ref --verify --quiet "$tag_ref"; then
                    echo "::error::Expected local tag ${EXPECTED_TAG} does not exist."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                  head_commit=$(git rev-parse HEAD)
                  if [ "$tag_commit" != "$head_commit" ]; then
                    echo "::error::Tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                    exit 1
                  fi

                  head_tags=$(git tag --points-at HEAD --sort=refname)
                  if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                    displayed_head_tags=${head_tags//$'\n'/, }
                    if [ -z "$displayed_head_tags" ]; then
                      displayed_head_tags="(none)"
                    fi
                    echo "::error::Expected ${EXPECTED_TAG} to be the only tag at HEAD, but found: ${displayed_head_tags}."
                    exit 1
                  fi

                  mkdir -p temp
                  npm run --silent changelog:release-notes -- --output "${RELEASE_NOTES_PATH}" --tag "$EXPECTED_TAG"
                  if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
                    echo "No release notes were generated." > "${RELEASE_NOTES_PATH}"
                  fi

            - name: "Check whether GitHub release already exists"
              id: "gh_release_check"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: "Create GitHub release"
              if: "steps.gh_release_check.outputs.exists != 'true'"
              uses: "softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228" # v3.0.2
              with:
                  body_path: "${{ env.RELEASE_NOTES_PATH }}"
                  draft: false
                  generate_release_notes: false
                  name: "${{ steps.version.outputs.tag }}"
                  prerelease: false
                  tag_name: "${{ steps.version.outputs.tag }}"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Release summary"
              if: "${{ !cancelled() }}"
              run: |
                  {
                    echo "## 🚀 Release Summary"
                    echo ""
                    echo "- Actor: @${{ github.actor }}"
                    echo "- Ref: \`${{ steps.target_ref.outputs.ref }}\`"
                    echo "- Source: \`${{ steps.target_ref.outputs.source }}\`"
                    echo "- Existing-tag recovery: \`${{ inputs.recover_existing_tag }}\`"
                    echo "- Package: \`${{ steps.version.outputs.package_name }}\`"
                    echo "- Version: \`${{ steps.version.outputs.version }}\`"
                    echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
                    echo "- npm package: [${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.version }}](${{ steps.version.outputs.npm_release_url }})"
                    echo "- GitHub release: [${{ steps.version.outputs.tag }}](${{ steps.version.outputs.github_release_url }})"
                  } >> "$GITHUB_STEP_SUMMARY"
